version: '3.8'

services:
  backend:
    image: ghcr.io/sprotasovitsky/mindnest/backend:production
    container_name: mindnest-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://mindnest-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
      - VERTEX_AI_PROJECT_ID=${VERTEX_AI_PROJECT_ID}
      - GCP_SERVICE_ACCOUNT_EMAIL=${GCP_SERVICE_ACCOUNT_EMAIL}
      - GCP_PRIVATE_KEY=${GCP_PRIVATE_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=false
      # Email
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - FRONTEND_URL=${FRONTEND_URL}
      # Social Login
      - GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID}
      - GOOGLE_ANDROID_CLIENT_ID=${GOOGLE_ANDROID_CLIENT_ID}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID}
      # OAuth 2.0 (MCP server authentication)
      - OAUTH_ISSUER=https://api.mindnest.one
      - OAUTH_RESOURCE_URI=https://api.mindnest.one
      # CORS
      - ALLOWED_ORIGINS=https://mindnest.one
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "app=mindnest"
      - "env=production"

  neo4j:
    image: neo4j:5.26-community
    container_name: mindnest-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_dbms_memory_heap_initial__size=2G
      - NEO4J_dbms_memory_heap_max__size=6G
      - NEO4J_dbms_memory_pagecache_size=2G
    volumes:
      - mindnest_neo4j_data:/data
      - mindnest_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "app=mindnest"
      - "env=production"

  postgres:
    image: postgres:16-alpine
    container_name: mindnest-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mindnest
      - POSTGRES_USER=mindnest
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - mindnest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindnest -d mindnest"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "app=mindnest"
      - "env=production"

volumes:
  mindnest_neo4j_data:
  mindnest_neo4j_logs:
  mindnest_postgres_data:

networks:
  default:
    name: mindnest-prod-network
