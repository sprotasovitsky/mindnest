<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindNest - AI Knowledge Management</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .logo {
            font-size: 64px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 32px;
            color: #1f2937;
            margin-bottom: 8px;
        }
        .tagline {
            color: #6366f1;
            font-size: 18px;
            margin-bottom: 24px;
        }
        p {
            color: #6b7280;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .store-badges {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .store-badges a {
            display: block;
        }
        .store-badges img {
            height: 50px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🧠</div>
        <h1>MindNest</h1>
        <p class="tagline">AI-first Knowledge Management</p>
        <p>Your personal AI assistant for managing knowledge, tasks, and projects through natural conversation.</p>
        <div class="store-badges">
            <a href="https://apps.apple.com/app/mindnest/id0000000000" target="_blank">
                <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on App Store">
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.mindnest.app" target="_blank">
                <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play" style="height: 75px; margin: -12px 0;">
            </a>
        </div>
    </div>
</body>
</html>
