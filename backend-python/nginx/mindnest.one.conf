server {
    listen 80;
    server_name mindnest.one;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mindnest.one;

    ssl_certificate /etc/letsencrypt/live/mindnest.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindnest.one/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:MindNestProdWebSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/mindnest-prod;
    index index.html;

    # Apple Universal Links & Android App Links
    location /.well-known/ {
        add_header Content-Type application/json;
    }

    # Password manager change-password redirect (W3C standard)
    location = /.well-known/change-password {
        return 302 /change-password;
    }

    # SPA routing - fallback to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
