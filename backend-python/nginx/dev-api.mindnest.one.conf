upstream mindnest_backend {
    server mindnest-backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name dev-api.mindnest.one;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dev-api.mindnest.one;

    ssl_certificate /etc/letsencrypt/live/dev-api.mindnest.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-api.mindnest.one/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:MindNestSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://mindnest_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
