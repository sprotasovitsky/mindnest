apiVersion: chainloop.dev/v1
kind: Policy
metadata:
  name: mindnest-tests-green
  description: The JUnit report must contain tests and none of them may fail
spec:
  policies:
    - kind: JUNIT_XML
      embedded: |
        package main

        import rego.v1

        # Chainloop parses the XML into input.elements: one entry per test suite,
        # with totals {tests, passed, failed, error, skipped} and the test cases.
        # Do not read chainloop_metadata.content: on push it is not the raw XML.
        total(field) := sum([object.get(s.totals, field, 0) | some s in input.elements])

        violations contains msg if {
            total("tests") == 0
            msg := "the JUnit report has no tests"
        }

        violations contains msg if {
            broken := total("failed") + total("error")
            broken > 0
            msg := sprintf("%d of %d tests failed", [broken, total("tests")])
        }

        violations contains msg if {
            some s in input.elements
            some t in s.tests
            t.status in {"failed", "error"}
            msg := sprintf("failed: %s.%s", [t.classname, t.name])
        }
