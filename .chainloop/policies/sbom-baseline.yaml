apiVersion: chainloop.dev/v1
kind: Policy
metadata:
  name: mindnest-sbom-baseline
  description: SBOM must list real dependencies and contain no strong-copyleft licenses
spec:
  policies:
    - kind: SBOM_CYCLONEDX_JSON
      embedded: |
        package main

        import rego.v1

        banned := {"GPL-2.0", "GPL-2.0-only", "GPL-2.0-or-later", "GPL-3.0", "GPL-3.0-only",
                   "GPL-3.0-or-later", "AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later", "SSPL-1.0"}

        # an SBOM of an unpinned requirements.txt comes out empty
        violations contains msg if {
            count(object.get(input, "components", [])) <= 10
            msg := sprintf("SBOM lists only %d components: scan the installed environment or image, not the source", [count(object.get(input, "components", []))])
        }

        violations contains msg if {
            some comp in input.components
            some lic in object.get(comp, "licenses", [])
            lic.license.id in banned
            msg := sprintf("%s %s uses %s", [comp.name, object.get(comp, "version", "?"), lic.license.id])
        }
