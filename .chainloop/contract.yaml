apiVersion: chainloop.dev/v1
kind: Contract
metadata:
  name: mindnest-backend-build
  description: What a MindNest backend build must hand over
spec:
  materials:
    - type: CONTAINER_IMAGE
      name: backend-image
      output: true
    - type: SBOM_CYCLONEDX_JSON
      name: backend-sbom
    - type: JUNIT_XML
      name: backend-tests
  # attestations are only accepted from GitHub Actions, not from a laptop
  runner:
    type: GITHUB_ACTION
  policies:
    materials:
      - ref: file://.chainloop/policies/sbom-baseline.yaml
        # a violation fails `attestation push`, even though the organization is ADVISORY
        gate: true
      - ref: file://.chainloop/policies/tests-green.yaml
        gate: true
    # checks the whole attestation, not one material
    attestation:
      - ref: file://.chainloop/policies/runner-authenticated.yaml
        gate: true
