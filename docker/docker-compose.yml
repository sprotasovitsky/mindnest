services:
  postgres:
    image: postgres:16-alpine
    container_name: mindnest-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindnest}
      POSTGRES_USER: ${POSTGRES_USER:-mindnest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindnest}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindnest} -d ${POSTGRES_DB:-mindnest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mindnest-network

  neo4j:
    image: neo4j:5.15-community
    container_name: mindnest-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-mindnest}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mindnest-network

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: mindnest-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mindnest-network

  # Backend (uncomment for full stack dev)
  # backend:
  #   build:
  #     context: ../backend
  #     dockerfile: Dockerfile
  #   container_name: mindnest-backend
  #   environment:
  #     POSTGRES_HOST: postgres
  #     POSTGRES_PORT: 5432
  #     POSTGRES_DB: ${POSTGRES_DB:-mindnest}
  #     POSTGRES_USER: ${POSTGRES_USER:-mindnest}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindnest}
  #     NEO4J_HOST: neo4j
  #     NEO4J_PORT: 7687
  #     NEO4J_USER: ${NEO4J_USER:-neo4j}
  #     NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mindnest}
  #     QDRANT_HOST: qdrant
  #     QDRANT_PORT: 6334
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     neo4j:
  #       condition: service_healthy
  #     qdrant:
  #       condition: service_healthy
  #   networks:
  #     - mindnest-network

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:

networks:
  mindnest-network:
    driver: bridge
