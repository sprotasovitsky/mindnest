name: Runner
options:
  bundleIdPrefix: com.mindnest
  deploymentTarget:
    iOS: "13.0"
  xcodeVersion: "15.0"

configs:
  Dev: debug
  Staging: release
  Prod: release

configFiles:
  Dev: Configurations/Dev.xcconfig
  Staging: Configurations/Staging.xcconfig
  Prod: Configurations/Prod.xcconfig

targets:
  Runner:
    type: application
    platform: iOS
    sources:
      - path: Runner
        excludes:
          - "Info.plist"
      - path: Flutter/AppFrameworkInfo.plist
        buildPhase: none
    info:
      path: Runner/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: $(DISPLAY_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(FLUTTER_BUILD_NAME)
        CFBundleVersion: $(FLUTTER_BUILD_NUMBER)
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchStoryboardName: LaunchScreen
        UIMainStoryboardFile: Main
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CADisableMinimumFrameSynchronization: true
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_ENABLE_MODULES: YES
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Runner/Runner-Bridging-Header.h
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: $(inherited)
    preBuildScripts:
      - name: "Run Script"
        script: |
          /bin/sh "$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh" build
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: "Thin Binary"
        script: |
          /bin/sh "$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh" embed_and_thin
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)

  RunnerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RunnerTests
    dependencies:
      - target: Runner
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Runner.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Runner

schemes:
  dev:
    build:
      targets:
        Runner: all
    run:
      config: Dev
    test:
      config: Dev
    profile:
      config: Dev
    analyze:
      config: Dev
    archive:
      config: Dev

  staging:
    build:
      targets:
        Runner: all
    run:
      config: Staging
    test:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging

  prod:
    build:
      targets:
        Runner: all
    run:
      config: Prod
    test:
      config: Prod
    profile:
      config: Prod
    analyze:
      config: Prod
    archive:
      config: Prod
