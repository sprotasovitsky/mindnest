name: MindNest
options:
  bundleIdPrefix: com.mindnest.app
  deploymentTarget:
    iOS: "13.0"
  xcodeVersion: "15.0"

# Flutter flavor configurations
# Format: <BuildType>-<flavor>
configs:
  Debug-dev: debug
  Profile-dev: release
  Release-dev: release
  Debug-staging: debug
  Profile-staging: release
  Release-staging: release
  Debug-prod: debug
  Profile-prod: release
  Release-prod: release

configFiles:
  Debug-dev: Configurations/Dev.xcconfig
  Profile-dev: Configurations/Dev.xcconfig
  Release-dev: Configurations/Dev.xcconfig
  Debug-staging: Configurations/Staging.xcconfig
  Profile-staging: Configurations/Staging.xcconfig
  Release-staging: Configurations/Staging.xcconfig
  Debug-prod: Configurations/Prod.xcconfig
  Profile-prod: Configurations/Prod.xcconfig
  Release-prod: Configurations/Prod.xcconfig

targets:
  MindNest:
    type: application
    platform: iOS
    sources:
      - path: MindNest
        excludes:
          - "Info.plist"
      - path: Flutter/AppFrameworkInfo.plist
        buildPhase: none
    info:
      path: MindNest/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: $(DISPLAY_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(FLUTTER_BUILD_NAME)
        CFBundleVersion: $(FLUTTER_BUILD_NUMBER)
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchStoryboardName: LaunchScreen
        UIMainStoryboardFile: Main
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CADisableMinimumFrameSynchronization: true
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_NAME: $(PRODUCT_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_ENABLE_MODULES: YES
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        SWIFT_OBJC_BRIDGING_HEADER: MindNest/MindNest-Bridging-Header.h
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: $(inherited)
    preBuildScripts:
      - name: "Run Script"
        script: |
          /bin/sh "$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh" build
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: "Thin Binary"
        script: |
          /bin/sh "$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh" embed_and_thin
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)

  MindNestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MindNestTests
    dependencies:
      - target: MindNest
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MindNest.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MindNest

schemes:
  dev:
    build:
      targets:
        MindNest: all
    run:
      config: Debug-dev
    test:
      config: Debug-dev
    profile:
      config: Profile-dev
    analyze:
      config: Debug-dev
    archive:
      config: Release-dev

  staging:
    build:
      targets:
        MindNest: all
    run:
      config: Debug-staging
    test:
      config: Debug-staging
    profile:
      config: Profile-staging
    analyze:
      config: Debug-staging
    archive:
      config: Release-staging

  prod:
    build:
      targets:
        MindNest: all
    run:
      config: Debug-prod
    test:
      config: Debug-prod
    profile:
      config: Profile-prod
    analyze:
      config: Debug-prod
    archive:
      config: Release-prod
