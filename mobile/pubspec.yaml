name: mindnest
description: AI-first knowledge and task management through chat interface.
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Routing
  go_router: ^16.2.0

  # HTTP client
  dio: ^5.4.0

  # Local storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI
  cupertino_icons: ^1.0.6
  flutter_markdown: ^0.6.18

  # Utils
  intl: ^0.20.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Social login
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # URL launcher
  url_launcher: ^6.2.5

  # Speech recognition (Whisper)
  whisper_ggml: ^1.7.0
  record: ^6.1.2
  path_provider: ^2.1.2

dependency_overrides:
  flutter_riverpod: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  riverpod_generator: ^3.0.1

flutter:
  uses-material-design: true
