spring:
  application:
    name: mindnest-backend
  threads:
    virtual:
      enabled: true

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mindnest}
    username: ${POSTGRES_USER:mindnest}
    password: ${POSTGRES_PASSWORD:mindnest}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Neo4j
  neo4j:
    uri: bolt://${NEO4J_HOST:localhost}:${NEO4J_PORT:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:mindnest}

server:
  port: 8080

# Qdrant
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  collection: knowledge_vectors

# Vertex AI
vertex-ai:
  project-id: ${VERTEX_AI_PROJECT_ID:}
  location: ${VERTEX_AI_LOCATION:us-central1}
  models:
    chat: gemini-2.5-flash-lite
    chat-pro: gemini-2.5-pro
    flash: gemini-2.5-flash-lite  # Fast model for intent detection
    embedding: gemini-embedding-001  # 3072 dimensions, 100+ languages
  generation:
    temperature: 0.7
    max-tokens: 2048

# Agent thresholds (similarity scores 0.0-1.0)
# All matching uses semantic similarity only - embeddings handle morphology and language variations
agent:
  thresholds:
    deduplication: 0.85      # Skip saving if existing item has same type and higher similarity
    update: 0.6              # Minimum similarity for semantic update match
    delete-auto: 0.85        # > this = delete without confirmation
    delete-confirm: 0.65     # > this = ask for confirmation before deleting
    task-search: 0.5         # Minimum similarity for task semantic search
  recency:
    max-boost: 0.05          # Maximum recency boost (5%)
    decay-days: 30           # Days over which boost decays to 0

# JWT
jwt:
  secret: ${JWT_SECRET:bWluZG5lc3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==}
  expiration: ${JWT_EXPIRATION:86400000}

# Logging
logging:
  level:
    com.mindnest: DEBUG
    org.springframework.data.neo4j: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
