name: Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sprotasovitsky/mindnest/backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend-python/requirements.txt

      - name: Install dependencies
        run: pip install -r backend-python/requirements.txt

  build-flutter-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Configure Google Sign-In for Web
        working-directory: mobile
        run: |
          sed -i 's/GOOGLE_WEB_CLIENT_ID_PLACEHOLDER/${{ secrets.PROD_GOOGLE_WEB_CLIENT_ID }}/g' web/index.html

      - name: Build Flutter web
        working-directory: mobile
        run: |
          flutter build web --release \
            --dart-define=ENVIRONMENT=prod \
            --dart-define=API_URL=https://api.mindnest.one/api

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: mobile/build/web
          include-hidden-files: true
          retention-days: 1

  build-and-deploy:
    needs: [test, build-flutter-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-python
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Download Flutter web build
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: flutter-web-build

      - name: Copy backend files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_EC2_HOST }}
          username: ${{ secrets.PRODUCTION_EC2_USER }}
          key: ${{ secrets.PRODUCTION_EC2_SSH_KEY }}
          source: "backend-python/docker-compose.prod.yml,backend-python/nginx/api.mindnest.one.conf,backend-python/nginx/mindnest.one.conf"
          target: "/opt/mindnest/"
          strip_components: 1

      - name: Copy Flutter web to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_EC2_HOST }}
          username: ${{ secrets.PRODUCTION_EC2_USER }}
          key: ${{ secrets.PRODUCTION_EC2_SSH_KEY }}
          source: "flutter-web-build"
          target: "/opt/mindnest/"

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_EC2_HOST }}
          username: ${{ secrets.PRODUCTION_EC2_USER }}
          key: ${{ secrets.PRODUCTION_EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/mindnest

            # Create .env file
            cat > .env << 'ENVEOF'
            # Database
            NEO4J_PASSWORD=${{ secrets.PROD_NEO4J_PASSWORD }}
            POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
            DATABASE_URL=postgresql+asyncpg://mindnest:${{ secrets.PROD_POSTGRES_PASSWORD }}@mindnest-postgres:5432/mindnest

            # Vertex AI (LLM)
            VERTEX_AI_PROJECT_ID=${{ secrets.PROD_GCP_PROJECT_ID }}
            GCP_SERVICE_ACCOUNT_EMAIL=${{ secrets.PROD_GCP_SERVICE_ACCOUNT_EMAIL }}
            GCP_PRIVATE_KEY=${{ secrets.PROD_GCP_PRIVATE_KEY }}

            # Security
            SECRET_KEY=${{ secrets.PROD_JWT_SECRET }}

            # Email (Resend)
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            EMAIL_FROM=MindNest <hello@mindnest.one>
            FRONTEND_URL=https://mindnest.one

            # Social Login (production)
            GOOGLE_IOS_CLIENT_ID=${{ secrets.PROD_GOOGLE_IOS_CLIENT_ID }}
            GOOGLE_ANDROID_CLIENT_ID=${{ secrets.PROD_GOOGLE_ANDROID_CLIENT_ID }}
            GOOGLE_WEB_CLIENT_ID=${{ secrets.PROD_GOOGLE_WEB_CLIENT_ID }}
            APPLE_CLIENT_ID=${{ secrets.PROD_APPLE_CLIENT_ID }}
            ENVEOF
            chmod 600 .env

            # Login to GitHub Container Registry
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u sprotasovitsky --password-stdin

            # Pull the new image
            docker pull ghcr.io/sprotasovitsky/mindnest/backend:production

            # Rename compose file
            mv docker-compose.prod.yml docker-compose.yml

            # Start services
            docker-compose up -d

            # Wait for backend to be healthy
            echo "Waiting for backend to start..."
            for i in $(seq 1 30); do
              if docker exec mindnest-backend curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "Backend is healthy!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 5
            done

            # Copy nginx configs and reload AFTER backend is up
            sudo cp nginx/api.mindnest.one.conf /etc/nginx/conf.d/
            sudo cp nginx/mindnest.one.conf /etc/nginx/conf.d/

            # Deploy Flutter web app (including hidden files like .well-known)
            sudo mkdir -p /var/www/mindnest
            sudo rm -rf /var/www/mindnest/{*,.*} 2>/dev/null || true
            sudo cp -r flutter-web-build/. /var/www/mindnest/

            # Validate and reload nginx
            sudo nginx -t && sudo systemctl reload nginx

            # Final health check
            docker exec mindnest-backend curl -f http://localhost:8000/health

      - name: External health check
        run: |
          sleep 10
          curl -f https://api.mindnest.one/health || echo "SSL may need initial setup"
