name: Deploy Landing Page to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Copy landing page to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_EC2_HOST }}
          username: ${{ secrets.PRODUCTION_EC2_USER }}
          key: ${{ secrets.PRODUCTION_EC2_SSH_KEY }}
          source: "mobile/web/landing/index.html,mobile/web/favicon.ico"
          target: "/var/www/mindnest-prod/"
          strip_components: 2

      - name: Copy nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_EC2_HOST }}
          username: ${{ secrets.PRODUCTION_EC2_USER }}
          key: ${{ secrets.PRODUCTION_EC2_SSH_KEY }}
          source: "backend-python/nginx/mindnest.one.conf"
          target: "/opt/termly/nginx/conf.d/"
          strip_components: 2

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_EC2_HOST }}
          username: ${{ secrets.PRODUCTION_EC2_USER }}
          key: ${{ secrets.PRODUCTION_EC2_SSH_KEY }}
          script: |
            docker exec termly-nginx nginx -t && docker exec termly-nginx nginx -s reload
            echo "Landing page deployed to mindnest.one"

      - name: Verify deployment
        run: |
          sleep 5
          curl -sf https://mindnest.one/ | grep -q "MindNest" && echo "Landing page is live!" || echo "Warning: could not verify landing page"
