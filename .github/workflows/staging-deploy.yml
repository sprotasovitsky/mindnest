name: Deploy to Staging

# build → attest (Chainloop, gated SBOM policy) → gate checks the image digest → deploy that exact digest.
# The mutable :staging tag moves only after a deploy that passed the gate and the health check.
on:
  push:
    branches: [main]
    paths:
      - 'backend-python/**'
      - 'mobile/**'
      - '.chainloop/**'
      - '.github/workflows/staging-deploy.yml'
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Skip the build and deploy an existing image (sha256:...). The Chainloop gate still checks it.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sprotasovitsky/mindnest/backend
  CHAINLOOP_VERSION: v1.138.0

jobs:
  test:
    if: inputs.image_digest == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend-python/requirements.txt

      - name: Install dependencies
        run: pip install -r backend-python/requirements.txt pytest

      # Failures are recorded in the JUnit report and attested; a policy decides what blocks
      - name: Run tests
        working-directory: backend-python
        env:
          DEBUG: 'true'
        run: python -m pytest tests -q --junitxml=junit.xml || echo "tests failed, recorded in junit.xml"

      - uses: actions/upload-artifact@v4
        with:
          name: junit
          path: backend-python/junit.xml
          retention-days: 7

  build-flutter-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Configure Google Sign-In for Web
        working-directory: mobile
        run: |
          sed -i 's/GOOGLE_WEB_CLIENT_ID_PLACEHOLDER/${{ secrets.STAGING_GOOGLE_WEB_CLIENT_ID }}/g' web/index.html

      - name: Build Flutter web
        working-directory: mobile
        run: |
          flutter build web --release \
            --dart-define=ENVIRONMENT=staging \
            --dart-define=API_URL=https://dev-api.mindnest.one/api

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: mobile/build/web
          include-hidden-files: true
          retention-days: 1

  build-and-attest:
    needs: test
    if: inputs.image_digest == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CHAINLOOP_TOKEN: ${{ secrets.CHAINLOOP_TOKEN }}
      DO_NOT_TRACK: '1'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the immutable commit tag here; :staging moves after the deploy
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend-python
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Image SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - uses: actions/download-artifact@v4
        with:
          name: junit

      - name: Install Chainloop CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sfL https://dl.chainloop.dev/cli/install.sh | bash -s -- --oss --version "$CHAINLOOP_VERSION" --path "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # gate: true in the contract makes a policy violation fail this push
      - name: Attest (policy gate)
        run: |
          chainloop attestation init --workflow backend-build --project mindnest
          chainloop attestation add --name backend-image --value "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          chainloop attestation add --name backend-sbom --value sbom.cdx.json
          chainloop attestation add --name backend-tests --value junit.xml
          chainloop attestation push

      - name: Mark attestation failed
        if: failure()
        run: chainloop attestation reset --trigger failure || true

  deploy:
    needs: [build-and-attest, build-flutter-web]
    # also runs when build-and-attest is skipped because a digest was given by hand
    if: ${{ !cancelled() && needs.build-flutter-web.result == 'success' && (needs.build-and-attest.result == 'success' || inputs.image_digest != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_DIGEST: ${{ inputs.image_digest || needs.build-and-attest.outputs.digest }}
      CHAINLOOP_TOKEN: ${{ secrets.CHAINLOOP_TOKEN }}
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v6

      - name: Install Chainloop CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sfL https://dl.chainloop.dev/cli/install.sh | bash -s -- --oss --version "$CHAINLOOP_VERSION" --path "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Deploy only an image that has a backend-build attestation with no policy violations
      - name: Chainloop gate
        run: |
          echo "Image: ${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          if ! chainloop discover --digest "$IMAGE_DIGEST" -o json > discover.json; then
            echo "::error::Chainloop has never seen ${IMAGE_DIGEST}: no attestation, no deploy"
            exit 1
          fi
          jq '[.result.references[]? | select(.kind == "ATTESTATION") | {attestation: .digest, workflow: .metadata.name, violations: .metadata.hasPolicyViolations}]' discover.json
          builds=$(jq '[.result.references[]? | select(.kind == "ATTESTATION" and .metadata.name == "backend-build")] | length' discover.json)
          clean=$(jq -r '[.result.references[]? | select(.kind == "ATTESTATION" and .metadata.name == "backend-build" and .metadata.hasPolicyViolations == "false")][0].digest // empty' discover.json)
          if [ "$builds" -eq 0 ]; then
            echo "::error::No backend-build attestation for ${IMAGE_DIGEST}: the image was not built by CI"
            exit 1
          fi
          if [ -z "$clean" ]; then
            echo "::error::Every backend-build attestation of ${IMAGE_DIGEST} has policy violations"
            exit 1
          fi
          echo "Gate passed: attestation $clean"
          echo "https://app.chainloop.dev/u/mindnest/workflow-runs/$clean" >> "$GITHUB_STEP_SUMMARY"

      - name: Download Flutter web build
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: flutter-web-build

      - name: Copy backend files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend-python/docker-compose.staging.yml,backend-python/nginx/dev-api.mindnest.one.conf,backend-python/nginx/dev.mindnest.one.conf"
          target: "/opt/mindnest/"
          strip_components: 1

      - name: Copy Flutter web to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "flutter-web-build"
          target: "/opt/mindnest/"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/mindnest

            # Create .env file
            cat > .env << 'ENVEOF'
            # Image that passed the Chainloop gate (read by docker-compose.yml)
            BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ env.IMAGE_DIGEST }}

            # Database
            NEO4J_PASSWORD=${{ secrets.STAGING_NEO4J_PASSWORD }}
            DATABASE_URL=postgresql+asyncpg://mindnest:${{ secrets.STAGING_POSTGRES_PASSWORD }}@termly-postgres:5432/mindnest_staging

            # Vertex AI (LLM)
            VERTEX_AI_PROJECT_ID=${{ secrets.STAGING_GCP_PROJECT_ID }}
            GCP_SERVICE_ACCOUNT_EMAIL=${{ secrets.STAGING_GCP_SERVICE_ACCOUNT_EMAIL }}
            GCP_PRIVATE_KEY=${{ secrets.STAGING_GCP_PRIVATE_KEY }}

            # Security
            SECRET_KEY=${{ secrets.STAGING_JWT_SECRET }}

            # Email (Resend)
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            EMAIL_FROM=MindNest <hello@mindnest.one>
            FRONTEND_URL=https://dev.mindnest.one

            # Social Login (staging)
            GOOGLE_IOS_CLIENT_ID=${{ secrets.STAGING_GOOGLE_IOS_CLIENT_ID }}
            GOOGLE_ANDROID_CLIENT_ID=${{ secrets.STAGING_GOOGLE_ANDROID_CLIENT_ID }}
            GOOGLE_WEB_CLIENT_ID=${{ secrets.STAGING_GOOGLE_WEB_CLIENT_ID }}
            APPLE_CLIENT_ID=${{ secrets.STAGING_APPLE_CLIENT_ID }}
            ENVEOF
            chmod 600 .env

            # Login to GitHub Container Registry
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u sprotasovitsky --password-stdin

            # Pull the exact image that passed the gate
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ env.IMAGE_DIGEST }}

            # Rename compose file if needed
            if [ -f docker-compose.staging.yml ]; then
              mv docker-compose.staging.yml docker-compose.yml
            fi

            # Start services
            docker-compose up -d

            # Wait for backend to be healthy
            echo "Waiting for backend to start..."
            for i in $(seq 1 30); do
              if docker exec mindnest-backend curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "Backend is healthy!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 5
            done

            # Copy nginx configs and reload AFTER backend is up
            cp nginx/dev-api.mindnest.one.conf /opt/termly/nginx/conf.d/
            cp nginx/dev.mindnest.one.conf /opt/termly/nginx/conf.d/

            # Deploy Flutter web app (including hidden files like .well-known)
            mkdir -p /var/www/mindnest
            rm -rf /var/www/mindnest/{*,.*} 2>/dev/null || true
            cp -r flutter-web-build/. /var/www/mindnest/

            docker exec termly-nginx nginx -s reload

            # Final health check
            docker exec mindnest-backend curl -f http://localhost:8000/health

      - name: External health check
        run: |
          sleep 10
          curl -f https://dev-api.mindnest.one/health || echo "SSL may need initial setup"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :staging now names what really runs on staging
      - name: Move :staging to the deployed digest
        run: docker buildx imagetools create -t "${REGISTRY}/${IMAGE_NAME}:staging" "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
