<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1026"/>
      <stop offset="100%" style="stop-color:#1A1B4B"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="115"/>
    </clipPath>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="60%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="vignette">
      <rect width="512" height="512" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- Scattered mini-graph with vignette fade -->
  <!-- Organic connected graph — irregular positions, varied spacing, some diagonal shortcuts -->
  <g clip-path="url(#rounded)" mask="url(#vignette)" opacity="0.22">
    <!-- Nodes — scattered but connected -->
    <circle cx="75"  cy="52"  r="8" fill="white"/>
    <circle cx="190" cy="68"  r="7" fill="white"/>
    <circle cx="330" cy="48"  r="7.5" fill="white"/>
    <circle cx="445" cy="70"  r="8" fill="white"/>
    <circle cx="42"  cy="145" r="7.5" fill="white"/>
    <circle cx="165" cy="125" r="7" fill="white"/>
    <circle cx="290" cy="110" r="8" fill="white"/>
    <circle cx="420" cy="150" r="7" fill="white"/>
    <circle cx="60"  cy="240" r="7" fill="white"/>
    <circle cx="185" cy="210" r="7.5" fill="white"/>
    <circle cx="320" cy="235" r="7" fill="white"/>
    <circle cx="455" cy="215" r="7.5" fill="white"/>
    <circle cx="48"  cy="330" r="7.5" fill="white"/>
    <circle cx="175" cy="315" r="7" fill="white"/>
    <circle cx="305" cy="340" r="7.5" fill="white"/>
    <circle cx="440" cy="310" r="7" fill="white"/>
    <circle cx="70"  cy="410" r="7" fill="white"/>
    <circle cx="200" cy="395" r="7.5" fill="white"/>
    <circle cx="350" cy="415" r="7" fill="white"/>
    <circle cx="465" cy="390" r="7.5" fill="white"/>
    <circle cx="110" cy="460" r="8" fill="white"/>
    <circle cx="256" cy="450" r="7.5" fill="white"/>
    <circle cx="400" cy="458" r="8" fill="white"/>
    <!-- Connections — organic paths, not a grid -->
    <line x1="75"  y1="52"  x2="190" y2="68"  stroke="white" stroke-width="5"/>
    <line x1="190" y1="68"  x2="330" y2="48"  stroke="white" stroke-width="5"/>
    <line x1="330" y1="48"  x2="445" y2="70"  stroke="white" stroke-width="5"/>
    <line x1="75"  y1="52"  x2="42"  y2="145" stroke="white" stroke-width="5"/>
    <line x1="190" y1="68"  x2="165" y2="125" stroke="white" stroke-width="5"/>
    <line x1="330" y1="48"  x2="290" y2="110" stroke="white" stroke-width="5"/>
    <line x1="445" y1="70"  x2="420" y2="150" stroke="white" stroke-width="5"/>
    <line x1="42"  y1="145" x2="165" y2="125" stroke="white" stroke-width="5"/>
    <line x1="165" y1="125" x2="290" y2="110" stroke="white" stroke-width="5"/>
    <line x1="290" y1="110" x2="420" y2="150" stroke="white" stroke-width="5"/>
    <line x1="42"  y1="145" x2="60"  y2="240" stroke="white" stroke-width="5"/>
    <line x1="165" y1="125" x2="185" y2="210" stroke="white" stroke-width="5"/>
    <line x1="420" y1="150" x2="455" y2="215" stroke="white" stroke-width="5"/>
    <line x1="60"  y1="240" x2="185" y2="210" stroke="white" stroke-width="5"/>
    <line x1="185" y1="210" x2="320" y2="235" stroke="white" stroke-width="5"/>
    <line x1="320" y1="235" x2="455" y2="215" stroke="white" stroke-width="5"/>
    <line x1="290" y1="110" x2="320" y2="235" stroke="white" stroke-width="5"/>
    <line x1="60"  y1="240" x2="48"  y2="330" stroke="white" stroke-width="5"/>
    <line x1="185" y1="210" x2="175" y2="315" stroke="white" stroke-width="5"/>
    <line x1="320" y1="235" x2="305" y2="340" stroke="white" stroke-width="5"/>
    <line x1="455" y1="215" x2="440" y2="310" stroke="white" stroke-width="5"/>
    <line x1="48"  y1="330" x2="175" y2="315" stroke="white" stroke-width="5"/>
    <line x1="175" y1="315" x2="305" y2="340" stroke="white" stroke-width="5"/>
    <line x1="305" y1="340" x2="440" y2="310" stroke="white" stroke-width="5"/>
    <line x1="48"  y1="330" x2="70"  y2="410" stroke="white" stroke-width="5"/>
    <line x1="175" y1="315" x2="200" y2="395" stroke="white" stroke-width="5"/>
    <line x1="305" y1="340" x2="350" y2="415" stroke="white" stroke-width="5"/>
    <line x1="440" y1="310" x2="465" y2="390" stroke="white" stroke-width="5"/>
    <line x1="70"  y1="410" x2="200" y2="395" stroke="white" stroke-width="5"/>
    <line x1="200" y1="395" x2="350" y2="415" stroke="white" stroke-width="5"/>
    <line x1="350" y1="415" x2="465" y2="390" stroke="white" stroke-width="5"/>
    <line x1="70"  y1="410" x2="110" y2="460" stroke="white" stroke-width="5"/>
    <line x1="200" y1="395" x2="256" y2="450" stroke="white" stroke-width="5"/>
    <line x1="350" y1="415" x2="400" y2="458" stroke="white" stroke-width="5"/>
    <line x1="110" y1="460" x2="256" y2="450" stroke="white" stroke-width="5"/>
    <line x1="256" y1="450" x2="400" y2="458" stroke="white" stroke-width="5"/>
    <!-- A few diagonal shortcuts for organic feel -->
    <line x1="42"  y1="145" x2="185" y2="210" stroke="white" stroke-width="5"/>
    <line x1="420" y1="150" x2="320" y2="235" stroke="white" stroke-width="5"/>
    <line x1="70"  y1="410" x2="256" y2="450" stroke="white" stroke-width="5"/>
    <line x1="465" y1="390" x2="400" y2="458" stroke="white" stroke-width="5"/>
  </g>
  <!-- Pillars -->
  <line x1="140" y1="148" x2="140" y2="368" stroke="white" stroke-width="14" opacity="0.5"/>
  <line x1="372" y1="148" x2="372" y2="368" stroke="white" stroke-width="14" opacity="0.5"/>
  <!-- Diagonals -->
  <line x1="140" y1="148" x2="200" y2="178" stroke="white" stroke-width="14" opacity="0.7"/>
  <line x1="200" y1="178" x2="256" y2="282" stroke="white" stroke-width="14" opacity="0.7"/>
  <line x1="256" y1="282" x2="312" y2="178" stroke="white" stroke-width="14" opacity="0.7"/>
  <line x1="312" y1="178" x2="372" y2="148" stroke="white" stroke-width="14" opacity="0.7"/>
  <!-- Corner nodes -->
  <circle cx="140" cy="148" r="22" fill="white"/>
  <circle cx="372" cy="148" r="22" fill="white"/>
  <circle cx="140" cy="368" r="22" fill="white"/>
  <circle cx="372" cy="368" r="22" fill="white"/>
  <!-- Shoulder nodes -->
  <circle cx="200" cy="178" r="17" fill="white" opacity="0.85"/>
  <circle cx="312" cy="178" r="17" fill="white" opacity="0.85"/>
  <!-- Mid-pillar nodes -->
  <circle cx="140" cy="225" r="11" fill="white" opacity="0.4"/>
  <circle cx="140" cy="298" r="11" fill="white" opacity="0.4"/>
  <circle cx="372" cy="225" r="11" fill="white" opacity="0.4"/>
  <circle cx="372" cy="298" r="11" fill="white" opacity="0.4"/>
  <!-- Center - glow -->
  <circle cx="256" cy="282" r="44" fill="white" opacity="0.1"/>
  <circle cx="256" cy="282" r="34" fill="white" opacity="0.15"/>
  <circle cx="256" cy="282" r="22" fill="white"/>
  <!-- Cross links -->
  <line x1="200" y1="178" x2="140" y2="225" stroke="white" stroke-width="7" opacity="0.25"/>
  <line x1="312" y1="178" x2="372" y2="225" stroke="white" stroke-width="7" opacity="0.25"/>
  <line x1="256" y1="282" x2="140" y2="298" stroke="white" stroke-width="7" opacity="0.2"/>
  <line x1="256" y1="282" x2="372" y2="298" stroke="white" stroke-width="7" opacity="0.2"/>
</svg>
